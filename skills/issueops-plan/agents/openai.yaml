interface:
  display_name: "IssueOps Plan"
  short_description: "Read the constraints, write the plan, get it reviewed, hand off the implementation"
  default_prompt: "Use $issueops-plan to prepare the reviewed plan and canonical worktree, then apply the shared automatic session handoff: available Herdr first inside a Herdr session, otherwise the current session or a manual handoff from a second terminal the user opened. Preserve explicit user choices, the current native host, and approved scope. Follow the shared release/recovery procedure before starting one new session in the existing worktree."
