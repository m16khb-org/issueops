interface:
  display_name: "IssueOps"
  short_description: "Route an issue-driven cycle across its ten stages"
  default_prompt: "Use $issueops to continue the exact selected cycle. After the branch and canonical worktree are prepared, follow references/session-choice.md: prefer ready Orca, otherwise use available Herdr with the same native host, otherwise continue in the current session. Preserve explicit user choices, the approved endpoint, and release/recovery fencing; never recreate the worktree or recursively hand off."
