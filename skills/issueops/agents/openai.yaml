interface:
  display_name: "IssueOps"
  short_description: "Route an issue-driven cycle across its ten stages"
  default_prompt: "Use $issueops to continue the exact selected cycle. After the branch and worktree are prepared, ask once for current session (recommended), a new session in the same worktree, or hold; preserve the choice and approved endpoint across handoff, then continue the authorized stages without repeated approval."
