interface:
  display_name: "IssueOps Remote Write"
  short_description: "The shared protocol for every governed IssueOps remote mutation"
  default_prompt: "Use $issueops-remote-write before any `issueops remote ...` write. Start from the render-template skeleton and the readable-body guide, polish the Korean body with fluent-korean, read the readability report in the preview, confirm the byte-identical request, read the artifact back, and reconcile instead of retrying when a result is ambiguous. Never write through raw gh or glab, never attach unredacted secrets, and never publish without a selected label and a concrete assignee."
