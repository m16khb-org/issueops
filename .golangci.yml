# golangci-lint v2 configuration.
#
# The linter set targets real defects, dead code, needless abstraction, and
# missing documentation of the exported API. Pure style and micro-performance
# linters (gocritic, perfsprint, predeclared, stylecheck, quickfix) stay off:
# they churn code without catching bugs. revive runs only its exported and
# package-comments rules, so every exported identifier and every package keeps
# a doc comment (ADR 2026-11-05); its other style rules stay off.
# unconvert stays off because syscall.Stat_t field types differ
# between darwin and linux, so a conversion needed on one is flagged on the other.
# golangci-lint is a CI/developer gate; it is not part of the harness
# install/update/self-verify readiness path (AGENTS.md §10: "issueops는 그 설치를
# 대행하거나 readiness gate로 요구하지 않는다"). CI and local runs share
# scripts/lint-local.sh, which pins the version.
version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    # Defects
    - asasalint
    - bidichk
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - fatcontext
    - govet
    - makezero
    - nilnesserr
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    # Dead code and needless abstraction
    - iface
    - ineffassign
    - unparam
    - unused
    - wastedassign
    # Legacy idioms with a standard replacement
    - copyloopvar
    - intrange
    - modernize
    - usestdlibvars
    - usetesting
    # Hygiene
    - misspell
    - nolintlint
    # Documentation of the exported API
    - revive
  settings:
    govet:
      enable-all: true
      disable:
        # Struct layout and shadowing are style choices here, not defects.
        - fieldalignment
        - shadow
    iface:
      enable:
        # Two interfaces with the same method set are one abstraction. The
        # opaque check stays off: injected constructors return the interface
        # their fakes also satisfy.
        - identical
    revive:
      rules:
        # Exported identifiers need a doc comment that starts with their name,
        # and a name must not repeat its package name.
        - name: exported
        # Every package needs exactly one package comment.
        - name: package-comments
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      # v1 enabled staticcheck (SA) and gosimple (S1), not stylecheck or quickfix.
      checks:
        - SA*
        - S1*
    usetesting:
      # os.MkdirTemp in tests is deliberate: short /tmp roots keep unix socket
      # paths under the length limit, and fakes stand in for injected TempDir.
      os-mkdir-temp: false
  exclusions:
    rules:
      # Tests compare error identity on purpose: a wrapped error must fail them.
      - path: _test\.go
        linters:
          - errorlint
      # Fakes must match injected signatures and test helpers name their
      # fixtures, so constant arguments and nil results there are not dead code.
      - path: _test\.go
        linters:
          - unparam
      # Test helpers are not API; their names document themselves.
      - path: _test\.go
        linters:
          - revive
    generated: lax
    presets:
      # The comments preset would hide the revive doc-comment findings above.
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
