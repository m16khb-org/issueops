# golangci-lint v2 configuration.
#
# gosimple is part of staticcheck in v2. Keep the previous linter set and
# default exclusion presets; report the complete list locally and in CI.
# golangci-lint is a CI/developer gate; it is not part of the harness
# install/update/self-verify readiness path (AGENTS.md §10).
version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # v1 enabled staticcheck (SA) and gosimple (S1), not stylecheck or quickfix.
      checks:
        - SA*
        - S1*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
