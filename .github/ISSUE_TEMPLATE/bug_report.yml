name: 버그 리포트
description: 재현 가능한 결함이나 회귀를 보고합니다.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        첫 절은 요약입니다. 필수 절은 순서대로 두고, 선택 절은 쓸 내용이 있을 때만 남기세요. 해시, 커밋 SHA, 로컬 경로, plan 원문은 적지 않습니다. 작성 지침: `skills/issueops-remote-write/references/readable-body.md`

  - type: textarea
    id: section_1
    attributes:
      label: 요약
      description: "무엇이 문제인지, 왜 지금 고치는지, 끝나면 무엇이 달라지는지 2~3문장으로 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_2
    attributes:
      label: 재현 절차
      description: "번호 목록으로 재현 절차를 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_3
    attributes:
      label: 기대 동작과 실제 동작
      description: "기대한 동작과 실제로 일어난 동작을 나눠 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_4
    attributes:
      label: 완료 기준
      description: "확인할 수 있는 동작을 체크리스트로 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_5
    attributes:
      label: 검증
      description: "실행할 검증 명령을 첫 코드 블록에 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_6
    attributes:
      label: 원인
      description: "확인한 원인을 적어 주세요. 추정이면 추정이라고 밝혀 주세요."
    validations:
      required: false

  - type: textarea
    id: section_7
    attributes:
      label: 범위
      description: "하는 것과 하지 않는 것을 함께 적어 주세요."
    validations:
      required: false

  - type: textarea
    id: section_8
    attributes:
      label: 환경과 로그
      description: "버전, OS, 재현에 필요한 로그 몇 줄을 적어 주세요. 토큰과 자격 증명은 지워 주세요."
    validations:
      required: false
