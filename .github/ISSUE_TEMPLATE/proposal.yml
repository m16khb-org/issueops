name: 제안
description: 아키텍처, API, 정책, 운영 방식 변경을 제안합니다.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        첫 절은 요약입니다. 필수 절은 순서대로 두고, 선택 절은 쓸 내용이 있을 때만 남기세요. 해시, 커밋 SHA, 로컬 경로, plan 원문은 적지 않습니다. 작성 지침: `skills/issueops-remote-write/references/readable-body.md`

  - type: textarea
    id: section_1
    attributes:
      label: 요약
      description: "무엇이 문제인지, 왜 지금 고치는지, 끝나면 무엇이 달라지는지 2~3문장으로 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_2
    attributes:
      label: 배경
      description: "누가 어떤 상황에서 무엇을 겪는지 적어 주세요. 입력과 출력, 수치, 로그 한 줄 같은 구체적인 장면 하나를 넣고, 코드 근거는 그 뒤에 짧게 붙입니다."
    validations:
      required: true

  - type: textarea
    id: section_3
    attributes:
      label: 제안
      description: "무엇을 바꾸자는 것인지 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_4
    attributes:
      label: 대안과 선택 이유
      description: "검토한 대안과 기각한 이유를 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_5
    attributes:
      label: 범위
      description: "하는 것과 하지 않는 것을 함께 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_6
    attributes:
      label: 완료 기준
      description: "확인할 수 있는 동작을 체크리스트로 적어 주세요."
    validations:
      required: false

  - type: textarea
    id: section_7
    attributes:
      label: 위험
      description: "남는 위험과 되돌리는 방법을 적어 주세요."
    validations:
      required: false

  - type: textarea
    id: section_8
    attributes:
      label: 열린 질문
      description: "아직 정하지 못한 것을 적어 주세요."
    validations:
      required: false
