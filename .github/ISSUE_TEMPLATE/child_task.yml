name: Child Task
description: IssueOps parent issue 아래의 provider-native child task를 등록합니다.
title: "[p] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        첫 절은 요약입니다. 필수 절은 순서대로 두고, 선택 절은 쓸 내용이 있을 때만 남기세요. 해시, 커밋 SHA, 로컬 경로, plan 원문은 적지 않습니다. 작성 지침: `skills/issueops-remote-write/references/readable-body.md`

  - type: textarea
    id: section_1
    attributes:
      label: 요약
      description: "부모 이슈 링크와 이 작업이 맡는 부분을 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_2
    attributes:
      label: 완료 기준
      description: "확인할 수 있는 동작을 체크리스트로 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_3
    attributes:
      label: 범위
      description: "하는 것과 하지 않는 것을 함께 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_4
    attributes:
      label: 선행 조건과 병합 조건
      description: "`[p]`/`[s]`, 선행 작업, 순서, 부모 브랜치에 병합하는 조건을 적어 주세요."
    validations:
      required: true

  - type: textarea
    id: section_5
    attributes:
      label: 검증
      description: "실행할 검증 명령을 첫 코드 블록에 적어 주세요."
    validations:
      required: false
