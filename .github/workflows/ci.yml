name: CI

# Mirrors the repo's already-deterministic local verification gate (AGENTS.md §9)
# on every branch push and pull request.
# The gate is split into independent parallel jobs: lint (static checks), race
# (Go race suite) and self-verify (build, deterministic self-verify, HTTP MCP
# install refusal). The self-verify gate runs with --llm-eval=false (LLM eval
# off) and a pinned --seed, so this is pure wiring of existing commands: no
# live-skill invocation and no model is required in CI.
on:
  workflow_dispatch:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # setup-uv stopped publishing major and minor tags at v8; pin the
      # immutable release tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.8"
          enable-cache: true
          cache-dependency-glob: scripts/python_test_requirements.txt

      - name: Format check (gofmt)
        # gofmt does not understand the `./...` package pattern, so check the
        # tracked Go files explicitly (this also skips vendored / worktree copies).
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint v2 (version pinned by scripts/lint-local.sh)
        # scripts/lint-local.sh owns the pinned version so local lint and CI
        # cannot drift. Build with the toolchain selected from go.mod.
        run: |
          version="$(./scripts/lint-local.sh --print-version)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${version}"
          printf '%s\n' "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint (golangci-lint v2)
        # Runs the same script developers run locally: it checks the pinned
        # version and builds with the toolchain selected from go.mod.
        run: ./scripts/lint-local.sh

      - name: Verify .golangci.yml against the golangci-lint schema
        # `golangci-lint run` silently ignores unknown config keys (checked on
        # v1.64.8: a bogus key exits 0 with no output), so a typo here would
        # disable the caps this repo depends on without any signal. `config
        # verify` catches it. It fetches the JSON schema from golangci-lint.run,
        # and a slow host timed out the former action-run verify before a single
        # linter ran (run 33489702571). Retry schema retrieval, then let an
        # unreachable host pass with a warning: an external service is not a
        # readiness gate for this repo (AGENTS.md philosophy).
        run: |
          lint="$(command -v golangci-lint || true)"
          if [ -z "$lint" ]; then lint="$(go env GOPATH)/bin/golangci-lint"; fi
          if [ ! -x "$lint" ]; then
            echo "::error::golangci-lint not found at $lint"; exit 1
          fi
          for attempt in 1 2 3; do
            if out="$("$lint" config verify 2>&1)"; then
              echo "$out"; exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q 'does not validate with'; then
              echo "::error::.golangci.yml violates the golangci-lint schema"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt could not load the schema; retrying"
              sleep $((attempt * 5))
            fi
          done
          echo "::warning::skipped .golangci.yml schema check: golangci-lint.run unreachable after 3 attempts"

      - name: Shell lint (shellcheck)
        # shellcheck ships on the GitHub-hosted Ubuntu image. This is a CI and
        # developer gate only; install, update, and self-verify never need it.
        run: shellcheck install.sh scripts/*.sh

      - name: Validate all skill frontmatter
        # Runs scripts/validate-skill.py over every skills/* dir so no SKILL.md
        # ships with malformed/unexpected frontmatter. `bash -e` (the default)
        # fails the step on the first invalid skill.
        run: |
          for dir in skills/*/; do
            [ -f "${dir}SKILL.md" ] || continue
            python3 scripts/validate-skill.py "$dir"
          done

      - name: Docs structure check (.issueops tree and links)
        # Same documentation check .issueops/OPERATIONS.md asks for before
        # committing; exits non-zero on a broken link or family violation.
        run: uv run --directory skills/project-docs-optimize python -m scripts.check --root "$PWD" --mode check --json

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.8"
          enable-cache: true
          cache-dependency-glob: scripts/python_test_requirements.txt

      - name: Prepare declared skill test dependencies
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/issueops-python"
          uv pip install --python "$RUNNER_TEMP/issueops-python/bin/python" -r scripts/python_test_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/issueops-python/bin" >> "$GITHUB_PATH"

      - name: Race test all packages
        run: go test -race ./... -count=1

  self-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.8"
          enable-cache: true
          cache-dependency-glob: scripts/python_test_requirements.txt

      - name: Prepare declared skill test dependencies
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/issueops-python"
          uv pip install --python "$RUNNER_TEMP/issueops-python/bin/python" -r scripts/python_test_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/issueops-python/bin" >> "$GITHUB_PATH"

      - name: Build
        run: go build -o bin/issueops ./cmd/issueops

      # Owns Python discovery and the normal Go suite (including golden tests)
      # once, in the same temporary HOME as native integration. Race runs in
      # its own job. The runner's user systemd manager looks for units under its
      # own HOME, so the HTTP MCP unit written under the temporary HOME never
      # loads; ADR 2026-10-02 forbids falling back to stdio silently, so CI
      # picks it here.
      - name: Deterministic self-verify gate (seed-pinned, --llm-eval=false)
        run: |
          tmp_home="$(mktemp -d)"
          cleanup() {
            chmod -R u+w "$tmp_home" 2>/dev/null || true
            rm -rf "$tmp_home"
          }
          trap cleanup EXIT
          HOME="$tmp_home" CODEX_HOME="$tmp_home/.codex" ./scripts/install-native.sh --skip-build --path-mode=skip --mcp-transport=stdio
          HOME="$tmp_home" CODEX_HOME="$tmp_home/.codex" ./bin/issueops self-verify --seed=100 --target-score=95 --llm-eval=false --json

      # The same temporary HOME with the HTTP transport: the runner's user
      # manager searches units under its own HOME, so the install must refuse
      # before it writes the credential or the unit instead of failing at
      # `systemctl --user enable` after writing both (#550).
      - name: HTTP MCP install refuses a HOME the user systemd manager does not search
        run: |
          tmp_home="$(mktemp -d)"
          cleanup() {
            chmod -R u+w "$tmp_home" 2>/dev/null || true
            rm -rf "$tmp_home"
          }
          trap cleanup EXIT
          if out="$(HOME="$tmp_home" CODEX_HOME="$tmp_home/.codex" ./scripts/install-native.sh --skip-build --path-mode=skip --mcp-transport=http 2>&1)"; then
            echo "$out"
            echo "::error::HTTP install from a temporary HOME succeeded"
            exit 1
          fi
          echo "$out"
          if ! grep -qF "is not searched by the running systemd user manager" <<<"$out"; then
            echo "::error::HTTP install failed without the unit search path error"
            exit 1
          fi
          for written in "$tmp_home/.local/state/issueops/mcp-http/bearer" "$tmp_home/.config/systemd/user/issueops-mcp.service"; do
            if [ -e "$written" ]; then
              echo "::error::refused HTTP install wrote $written"
              exit 1
            fi
          done
