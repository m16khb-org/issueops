name: CI

# Mirrors the repo's already-deterministic local verification gate (AGENTS.md §9)
# on every branch push and pull request.
# The self-verify gate runs with --judge none (LLM eval off by default) and a
# pinned --seed, so this is pure wiring of existing commands: no live-skill
# invocation and no model is required in CI.
on:
  workflow_dispatch:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      # setup-uv stopped publishing major and minor tags at v8; pin the
      # immutable release tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.8"
          enable-cache: true
          cache-dependency-glob: scripts/python_test_requirements.txt

      - name: Prepare declared skill test dependencies
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/issueops-python"
          uv pip install --python "$RUNNER_TEMP/issueops-python/bin/python" -r scripts/python_test_requirements.txt
          printf '%s\n' "$RUNNER_TEMP/issueops-python/bin" >> "$GITHUB_PATH"

      - name: Format check (gofmt)
        # gofmt does not understand the `./...` package pattern, so check the
        # tracked Go files explicitly (this also skips vendored / worktree copies).
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint v2)
        # Build with the toolchain selected from go.mod. Local lint uses the
        # same toolchain so a newer ambient GOROOT cannot break its analyzers.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          # The action runs `config verify` before linting, and that fetches the
          # JSON schema from golangci-lint.run. When the host is slow the fetch
          # times out and the job dies before a single linter runs (run
          # 33489702571). The config check moves to the next step, where an
          # unreachable host is a warning and a real schema violation still fails.
          verify: false

      - name: Verify .golangci.yml against the golangci-lint schema
        # `golangci-lint run` silently ignores unknown config keys (checked on
        # v1.64.8: a bogus key exits 0 with no output), so a typo here would
        # disable the caps this repo depends on without any signal. `config
        # verify` catches it. Retry schema retrieval, then let an
        # unreachable host pass with a warning: an external service is not a
        # readiness gate for this repo (AGENTS.md philosophy).
        run: |
          lint="$(command -v golangci-lint || true)"
          if [ -z "$lint" ]; then lint="$(go env GOPATH)/bin/golangci-lint"; fi
          if [ ! -x "$lint" ]; then
            echo "::error::golangci-lint not found at $lint"; exit 1
          fi
          for attempt in 1 2 3; do
            if out="$("$lint" config verify 2>&1)"; then
              echo "$out"; exit 0
            fi
            echo "$out"
            if echo "$out" | grep -q 'does not validate with'; then
              echo "::error::.golangci.yml violates the golangci-lint schema"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt could not load the schema; retrying"
              sleep $((attempt * 5))
            fi
          done
          echo "::warning::skipped .golangci.yml schema check: golangci-lint.run unreachable after 3 attempts"

      - name: Shell lint (shellcheck)
        # shellcheck ships on the GitHub-hosted Ubuntu image. This is a CI and
        # developer gate only; install, update, and self-verify never need it.
        run: shellcheck install.sh scripts/*.sh

      - name: Validate all skill frontmatter
        # Runs scripts/validate-skill.py over every skills/* dir so no SKILL.md
        # ships with malformed/unexpected frontmatter. `bash -e` (the default)
        # fails the step on the first invalid skill.
        run: |
          for dir in skills/*/; do
            [ -f "${dir}SKILL.md" ] || continue
            python3 scripts/validate-skill.py "$dir"
          done

      - name: Build
        run: go build -o bin/issueops ./cmd/issueops

      - name: Race test all packages
        run: go test -race ./... -count=1

      # Owns Python discovery and the normal Go suite (including golden tests)
      # once, in the same temporary HOME as native integration. Race stays above.
      - name: Deterministic self-verify gate (seed-pinned, --judge none)
        run: |
          tmp_home="$(mktemp -d)"
          cleanup() {
            chmod -R u+w "$tmp_home" 2>/dev/null || true
            rm -rf "$tmp_home"
          }
          trap cleanup EXIT
          HOME="$tmp_home" CODEX_HOME="$tmp_home/.codex" ./scripts/install-native.sh --skip-build --path-mode=skip
          HOME="$tmp_home" CODEX_HOME="$tmp_home/.codex" ./bin/issueops self-verify --seed=100 --target-score=95 --llm-eval=false --json
